name: Patch Issue 31 Success Summary

on:
  push:
    branches:
      - feature/issue-31-correctivos-frontend
    paths:
      - .github/workflows/patch-issue31-success.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-31-correctivos-frontend
          fetch-depth: 0
      - name: Patch confirmation summary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/views/CorrectiveCreate.vue')
          text = path.read_text()
          old = '''    const result = await registrarCorrectivo(buildCorrectivoPayload({ form: form.value, trabajos: trabajos.value }))
    await Swal.fire({
      icon: 'success',
      title: 'Correctivo registrado',
      text: `Intervención #${result.id} guardada con ${result.trabajos} trabajo${result.trabajos === 1 ? '' : 's'}.`,
      timer: 1800,
      showConfirmButton: false,
    })'''
          new = '''    const result = await registrarCorrectivo(buildCorrectivoPayload({ form: form.value, trabajos: trabajos.value }))
    const equipo = equipoSeleccionado.value
    const primerTrabajo = trabajos.value[0]?.detalle || 'Trabajo registrado'
    await Swal.fire({
      icon: 'success',
      title: 'Correctivo registrado',
      html: `<div style="text-align:left"><strong>${equipo?.patente || ''} ${equipo?.descripcion || ''}</strong><br>Fecha: ${form.value.fecha}<br>KM/Hora: ${Number(form.value.km_hora || 0).toLocaleString()}<br>Trabajo: ${primerTrabajo}<br><small>Intervención #${result.id} · ${result.trabajos} trabajo${result.trabajos === 1 ? '' : 's'}</small></div>`,
      confirmButtonText: 'Registrar otro',
      confirmButtonColor: '#e11d48',
    })'''
          if old not in text:
              raise SystemExit('Bloque de confirmacion esperado no encontrado')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-issue31-success.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/views/CorrectiveCreate.vue .github/workflows/patch-issue31-success.yml
          git commit -m "feat(correctivos): mostrar resumen al confirmar (#31)"
          git push origin HEAD:feature/issue-31-correctivos-frontend
